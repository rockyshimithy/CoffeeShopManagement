[project]
name = "coffee-shop-management"
version = "0.1.0"
description = "Coffee Shop Management combining Workforce, Stores, and Products services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django==6.1.3",
    "django-mongodb-backend==6.1.0",
    "djangorestframework>=3.18",
    "django-filter>=26.2",
    "django-cors-headers>=4.9",
    "django-environ>=0.14",
]

[dependency-groups]
dev = [
    "pytest-django>=4.8",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "pdbpp>=0.10.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
exclude = ["**/migrations/", "src/mongo_migrations/", "specs/"]

[tool.ruff.lint]
# Django's Meta.indexes is a plain list by design, so RUF012 is a false positive there.
ignore = ["RUF012"]
