services:
  web:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    command: python src/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DATABASE_URL=postgres://postgres:postgres@db:5432/coffeeshop_db
    depends_on:
      - db
    tty: true
    stdin_open: true

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=coffeeshop_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: