services:
  web:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    command: python src/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - MONGO_URI=mongodb://mongo:27017/?directConnection=true
      - MONGO_DB=coffeeshop
    depends_on:
      mongo:
        condition: service_healthy
    tty: true
    stdin_open: true

  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'try { rs.status() } catch { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"127.0.0.1:27017\"}]}) }; db.hello().isWritablePrimary' | grep -q true",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mongo_data:
